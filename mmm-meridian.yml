# Google Meridian with TensorFlow and JAX on CUDA 12, both supplied by pip wheels.
# Build inside WSL2: TensorFlow has no native Windows GPU support after 2.10.
name: mmm-meridian
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - google-meridian[and-cuda]==2.2.0
      # GeoX is a separate package (the unrelated "geox" on PyPI is not it).
      - meridian-geox==1.0.1
      - tensorflow==2.21.0
      - tf-keras==2.21.0
      - tfp-nightly==0.26.0.dev20260130
      - jax==0.12.0.1
      - arviz==0.19.0
      - numpy==2.3.5
      - pandas==2.3.3
      - scipy==1.18.1
      - ipykernel
