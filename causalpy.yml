# CausalPy. Separate from mmm-pymc because CausalPy 0.9 requires pymc<6 and arviz<1.
# Build inside WSL2: JAX has no native Windows GPU support.
name: causalpy
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - gxx  # PyTensor needs g++ for fast CPU sampling
  - pip:
      - causalpy==0.9.0
      - pymc==5.28.5
      - pytensor==2.38.3
      - arviz==0.23.4
      - numpyro[cuda13]==0.22.0
      - jax==0.12.0.1
      - numpy==2.4.6
      - pandas==3.1.1
      - scipy==1.18.1
      - ipykernel
