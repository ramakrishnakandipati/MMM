# PyMC-Marketing with GPU sampling through NumPyro/JAX.
# Build inside WSL2: JAX has no native Windows GPU support.
name: mmm-pymc
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - gxx  # PyTensor needs g++ for fast CPU sampling
  - pip:
      - pymc-marketing==1.3.0
      - pymc==6.3.2
      - pytensor==3.3.8
      - arviz==1.3.0
      - numpyro[cuda13]==0.22.0
      - jax==0.12.0.1
      - numpy==2.4.6
      - pandas==3.1.1
      - scipy==1.18.1
      - ipykernel
